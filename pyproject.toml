[project]
name = "arbitron"
version = "0.1.0"
description = "Autonomous spot crypto trading bot: paper and backtest first, fail closed."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bijesh Mohan" }]
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
]

[project.scripts]
arbitron = "arbitron.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "ASYNC", "PT", "RET", "PL", "TID",
]
ignore = [
    "PLR2004", # magic values are fine in tests and explicit config bounds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]
"src/arbitron/ports/errors.py" = ["N818"]  # names follow the plan's error taxonomy

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["arbitron"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
