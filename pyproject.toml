[project]
name = "arbitron"
version = "0.1.0"
description = "Autonomous spot crypto trading bot: paper and backtest first, fail closed."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bijesh Mohan" }]
dependencies = [
    "alembic>=1.20,<2",
    "ccxt>=4.5.85,<5",
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.23,<1",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn>=0.38,<1",
]

[project.scripts]
arbitron = "arbitron.cli:main"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "testcontainers[postgres]>=4.15,<5",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "DTZ", "ASYNC", "PT", "RET", "PL", "TID",
]
ignore = [
    "PLR2004", # magic values are fine in tests and explicit config bounds
    "PLR0913", # keyword-only constructor/config arguments are explicit, not a smell
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "PLR0917"]  # asserts; fake secrets; seeded RNGs; positional pytest params
"typings/**" = ["N"]  # third-party names as published
"src/arbitron/persistence/migrations/versions/**" = ["E501"]  # generated DDL strings
"src/arbitron/ports/errors.py" = ["N818"]  # names follow the plan's error taxonomy

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs PostgreSQL (Docker via testcontainers, or ARBITRON_TEST_DATABASE_URL)",
    "live_exchange: calls a real venue; opt-in via ARBITRON_LIVE_EXCHANGE_TESTS=1",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["arbitron"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
