# Local development database only. Not for production use.
#   docker compose -f deploy/compose.dev.yaml up -d
#   export ARBITRON_DATABASE_URL=postgresql+psycopg://arbitron:arbitron@localhost:5432/arbitron
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: arbitron
      POSTGRES_PASSWORD: arbitron  # dev-only placeholder
      POSTGRES_DB: arbitron
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbitron -d arbitron"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
